    window.__timelines = window.__timelines || {};
    (function () {
      var INK = "#FFFDF6";
      var SUN = "#F8C454";
      var DIM = 0.45;
      var ROW_LEAD = 0.18; /* the row slides in just before its beat, so it LIGHTS on the downbeat */

      var tl = gsap.timeline({ paused: true });

      /* camera: one faint push while the ledger assembles, frozen across the held tail */
      tl.fromTo(".f04-cam", { scale: 1 }, { scale: 1.014, duration: 7, ease: "none" }, 0);

      /* Scene 1 (0.00–2.09) — topbar ledger establishes the empty list region */
      tl.fromTo(".f04-micro", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.06);
      tl.fromTo(".f04-headline", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 0.2);
      tl.fromTo(".f04-head-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.72, ease: "power2.out" }, 0.36);

      /* one ledger row lights per bar — local 0 / 2.09 / 4.18 / 6.27s, then the tail holds */
      var beats = [0.74, 2.09, 4.18, 6.27];
      var rows = Array.prototype.slice.call(document.querySelectorAll(".f04-row"));

      rows.forEach(function (row, i) {
        var beat = beats[i];
        var first = i === 0;
        var at = first ? beat : beat - ROW_LEAD;
        var num = row.querySelector(".f04-num");
        var title = row.querySelector(".f04-t");
        var body = row.querySelector(".f04-b");
        var rule = row.querySelector(".f04-rule");

        /* row slides the short distance straight into its slot; cells expand center-outward */
        tl.fromTo(row, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at);
        tl.fromTo(title, { x: 84 }, { x: 0, duration: 0.7, ease: "power3.out" }, at + 0.06);
        tl.fromTo(body, { x: 44 }, { x: 0, duration: 0.7, ease: "power3.out" }, at + 0.12);
        tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.78, ease: "power2.out" }, at + 0.04);

        /* the numeral ignites on the beat — the frame's one gold accent */
        tl.set(num, { color: SUN }, beat);
        if (first) {
          tl.fromTo(num, { x: 120 }, { x: 0, duration: 0.72, ease: "power3.out" }, beat);
        } else {
          tl.fromTo(num, { scale: 0, x: 120 }, { scale: 1, x: 0, duration: 0.52, ease: "power3.out" }, beat);
        }

        /* the row that leaves the light dims by position and cools back to ink */
        if (i > 0) {
          var prev = rows[i - 1];
          tl.fromTo(prev, { opacity: 1 }, { opacity: DIM, duration: 0.7, ease: "power1.out", immediateRender: false }, beat);
          tl.fromTo(prev.querySelector(".f04-num"), { color: SUN }, { color: INK, duration: 0.7, ease: "power1.out", immediateRender: false }, beat);
        }
      });

      tl.seek(0);
      window.__timelines["04-cara-kerja"] = tl;
    })();
