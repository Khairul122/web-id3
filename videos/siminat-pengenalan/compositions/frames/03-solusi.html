    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FRAME_ID = "03-solusi";
        var DUR = 6.26;
        var VIEW_W = 1920;

        var $ = function (id) { return document.getElementById(id); };
        var stage = $("03-solusi-stage");
        var world = $("03-solusi-world");

        // ---- camera: ONE writer for the single .world transform (viewport-change) ----
        var cam = { x: 0, y: 0, scale: 1 };
        var drift = { p: 0 };
        var DRIFT_X = 3;       // 2-8 px, imperceptible per frame
        var DRIFT_Y = 1.8;     // 1-4 px
        var DRIFT_RATIO = 1.3; // organic Lissajous, not a mechanical diagonal
        var DRIFT_CYCLES = 1;  // one slow breath across the whole shot

        function applyCamera() {
          var dx = Math.sin(drift.p) * DRIFT_X;
          var dy = Math.sin(drift.p * DRIFT_RATIO) * DRIFT_Y;
          world.style.transform =
            "translate(" + (cam.x + dx) + "px, " + (cam.y + dy) + "px) scale(" + cam.scale + ")";
        }

        // ---- pan-to-target: measure each station's real laid-out center once at
        // setup and bake it (no zoom -> counter-translate T = -offset; measure,
        // never hand-derive). The authored centers are the fallback only if the
        // frame is not laid out yet when this runs. ----
        var AUTHORED_CENTER_X = [730, 1750, 3320];
        var stageRect = stage.getBoundingClientRect();
        var camAt = ["03-solusi-station1", "03-solusi-station2", "03-solusi-station3"].map(function (id, i) {
          var r = $(id).getBoundingClientRect();
          var centerX = r.width > 0 ? r.left + r.width / 2 - stageRect.left : AUTHORED_CENTER_X[i];
          return -(centerX - VIEW_W / 2);
        });

        cam.x = camAt[0];
        applyCamera(); // seed frame 0 - the camera opens on station 1

        // ---- connector rail: measured dash setup (svg-path-draw) ----
        [ $("03-solusi-seg1"), $("03-solusi-seg2") ].forEach(function (seg) {
          var len = typeof seg.getTotalLength === "function" ? seg.getTotalLength() : 980;
          seg.style.strokeDasharray = len + "px";
          seg.style.strokeDashoffset = len + "px";
        });

        // ---- one paused timeline, built synchronously ----
        var tl = gsap.timeline({ paused: true });

        // drift spine: continuous micro-drift under every camera phase
        tl.to(drift, { p: Math.PI * 2 * DRIFT_CYCLES, duration: DUR, ease: "none", onUpdate: applyCamera }, 0);

        // ---- Scene 1 (0.00-2.09) - opens on station 1: MASUKAN ----
        tl.fromTo($("03-solusi-marker1"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.06);
        tl.fromTo($("03-solusi-label1"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.1);
        tl.fromTo($("03-solusi-row1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.22);
        tl.fromTo($("03-solusi-rowrule"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.48);
        tl.fromTo($("03-solusi-row2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.56);
        tl.fromTo($("03-solusi-pagenum"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.5, ease: "power1.out" }, 0.3);

        // pan 1 - the camera slides right and lands station 2 on the beat (local 2.09)
        tl.to(cam, { x: camAt[1], duration: 1.01, ease: "power2.inOut", onUpdate: applyCamera }, 1.08);

        // ---- Scene 2 (2.09-4.18) - lands on station 2: PROSES ----
        tl.fromTo($("03-solusi-marker2"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.16);
        tl.fromTo($("03-solusi-label2"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.2);
        tl.fromTo($("03-solusi-h2a"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 2.3);
        tl.fromTo($("03-solusi-h2b"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 2.44);

        // connector segment 1 draws itself left -> right, landing on station 2
        tl.to($("03-solusi-seg1"), { strokeDashoffset: "0px", duration: 0.6, ease: "power2.out" }, 2.5);

        // pan 2 - calm traverse; the camera follows the line, landing on the beat (local 4.18)
        tl.to(cam, { x: camAt[2], duration: 1.2, ease: "power1.inOut", onUpdate: applyCamera }, 2.98);
        // connector segment 2 draws ahead of the camera, toward station 3
        tl.to($("03-solusi-seg2"), { strokeDashoffset: "0px", duration: 0.6, ease: "power2.out" }, 3.0);
        // station 3's marker waits at the line's far end
        tl.fromTo($("03-solusi-marker3"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.35);

        // ---- Scene 3 (4.18-6.26) - lands on station 3: HASIL ----
        tl.fromTo($("03-solusi-label3"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.2);
        tl.fromTo($("03-solusi-h3a"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.32);
        tl.fromTo($("03-solusi-h3b"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.46);
        // the live-site window slides in from the right and stops at its hero
        // position on the beat (local 5.22); everything is still afterwards
        tl.fromTo($("03-solusi-window"), { x: 1150 }, { x: 0, duration: 0.8, ease: "power2.out" }, 4.42);

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
        tl.seek(0);
      })();
