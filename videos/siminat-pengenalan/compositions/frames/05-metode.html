  <script>
    (function () {
      "use strict";

      /* svg-path-draw setup — real measured geometry, set before the first render */
      function primeWires() {
        var wires = document.querySelectorAll(".f05-wire");
        for (var i = 0; i < wires.length; i += 1) {
          var len = wires[i].getTotalLength();
          wires[i].style.strokeDasharray = String(len);
          wires[i].style.strokeDashoffset = String(len);
        }
      }

      function build() {
        var EASE = "power3.out";
        var tl = gsap.timeline({ paused: true });

        /* blueprinted macro camera: a very slow continuous zoom-in under the whole shot */
        tl.fromTo(".f05-cam", { scale: 1 }, { scale: 1.035, duration: 6.27, ease: "none" }, 0);

        /* ── Scene 1 (0.00–2.09): the method announces itself ─────────────────── */
        tl.fromTo(".f05-micro-row", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE }, 0.06);
        tl.fromTo(".f05-hl-1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: EASE }, 0.14);
        tl.fromTo(".f05-hl-2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: EASE }, 0.26);
        tl.fromTo(".f05-rule-a", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.42);
        tl.fromTo(".f05-f1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: EASE }, 0.5);
        /* context window lands softly at the bottom-right of the content area */
        tl.fromTo(".f05-win", { opacity: 0, y: 22, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power2.out" }, 0.66);

        /* ── Scene 2 (2.09–4.18): formula 2 + the tree draws itself ───────────── */
        tl.fromTo(".f05-rule-b", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 2.14);
        tl.fromTo(".f05-f2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: EASE }, 2.16);
        /* root node pops in as the draw's origin (spring-pop-entrance, smooth settle) */
        tl.fromTo("#f05-metode-node-root", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.46, ease: EASE }, 2.09);
        /* svg-path-draw: trunk, then three branches at ~85% overlap of the previous */
        tl.to("#f05-metode-trunk", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.26);
        tl.to("#f05-metode-wire-left", { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 2.56);
        tl.to("#f05-metode-wire-mid", { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 2.62);
        tl.to("#f05-metode-wire-right", { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" }, 2.68);
        /* each leaf node pops in at the end of its own branch draw */
        tl.fromTo("#f05-metode-leaf-left", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: EASE }, 2.9);
        tl.fromTo("#f05-metode-leaf-mid", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: EASE }, 2.96);
        tl.fromTo("#f05-metode-leaf-right", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: EASE }, 3.02);
        tl.fromTo(".f05-note", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.48);

        /* ── Scene 3 (4.18–6.27): the number ─────────────────────────────────── */
        tl.fromTo(".f05-rule-c", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.out" }, 4.18);

        /* counting-dynamic-scale: value climbs 0 → 88,9 and the transform scale grows
           to the final type size on the SAME ease. Value steps are discrete, seek-safe
           keyframes (same pattern as the platform's own counter composition). */
        var counterEl = document.getElementById("f05-metode-counter");
        var COUNT_AT = 4.18;
        var COUNT_DUR = 1.2;
        var TARGET = 88.9;
        var STEPS = 36;
        var START_SCALE = 0.45;
        for (var i = 0; i <= STEPS; i += 1) {
          var p = i / STEPS;
          var eased = 1 - Math.pow(1 - p, 3); /* mirrors ease: power3.out */
          tl.set(counterEl, { textContent: (TARGET * eased).toFixed(1).replace(".", ",") }, COUNT_AT + p * COUNT_DUR);
        }
        tl.fromTo(counterEl, { scale: START_SCALE, opacity: 0 }, { scale: 1, opacity: 1, duration: COUNT_DUR, ease: EASE }, COUNT_AT);

        /* suffix slides in after the count lands — never during */
        tl.fromTo(".f05-pct", { opacity: 0, y: 26, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.7)" }, 5.38);
        tl.fromTo(".f05-label-a", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.34, ease: EASE }, 5.4);
        tl.fromTo(".f05-label-b", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.34, ease: EASE }, 5.5);
        tl.fromTo(".f05-foot-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 5.48);
        tl.fromTo(".f05-footnote", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" }, 5.54);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-metode"] = tl;
        tl.seek(0); /* hold the landed composition still through the cut */
      }

      function boot() {
        primeWires();
        build();
      }

      if (window.gsap) {
        boot();
      } else {
        /* the host preloads gsap; this only covers a cold standalone preview */
        var tries = 0;
        var iv = setInterval(function () {
          tries += 1;
          if (window.gsap) {
            clearInterval(iv);
            boot();
          } else if (tries > 600) {
            clearInterval(iv);
          }
        }, 10);
      }
    })();
  </script>
