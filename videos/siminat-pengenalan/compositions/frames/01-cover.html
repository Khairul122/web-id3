  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const byId = function (id) { return document.getElementById(id); };

      /* Beat spine — the bed is 115 BPM; four beats make the 2.09s measure grid.
         Scene onsets are the packet windows (0 / 2.0 / 4.08, the frame's downbeats). */
      const BEAT = 60 / 115; /* 0.5217s — every accent below reads off this one grid */
      const S2 = 2.0;        /* Scene 2 — display line 1 + pagenum */
      const S3 = 4.08;       /* Scene 3 — gold italic + footer band */
      const DUR = 6.165;     /* frame duration, fixed upstream */

      /* Scene 1 — ground settles; the mark blooms open, the eyebrow follows one beat later (one run, long tails). */
      tl.fromTo(byId("01-cover-sun"), { opacity: 0.58, scale: 1.07 }, { opacity: 1, scale: 1, duration: 1.9, ease: "power2.out" }, 0);
      tl.fromTo(byId("01-cover-halo"), { opacity: 0.55, scale: 1.05 }, { opacity: 1, scale: 1, duration: 2.2, ease: "power2.out" }, 0);
      tl.fromTo(byId("01-cover-ember"), { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 2.4, ease: "sine.out" }, 0);
      tl.fromTo(byId("01-cover-glow"), { opacity: 0, scale: 0.45 }, { opacity: 0.5, scale: 1.3, duration: 1.3, ease: "power2.out" }, BEAT * 0.5);
      tl.fromTo(byId("01-cover-logo"), { opacity: 0, scale: 0.84, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.0, ease: "expo.out" }, BEAT * 0.5);
      tl.fromTo(byId("01-cover-eyebrow"), { opacity: 0, y: 10, letterSpacing: "0.34em", filter: "blur(3px)" }, { opacity: 1, y: 0, letterSpacing: "0.18em", filter: "blur(0px)", duration: 1.2, ease: "power3.out" }, BEAT);

      /* Scene 2 — beat one of the type: the line dives in (hard slam, lands left); pagenum tags on the next beat. */
      tl.fromTo(byId("01-cover-line-1"), { opacity: 0, scale: 1.5, y: -70, filter: "blur(16px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.62, ease: "power4.out" }, S2);
      tl.fromTo(byId("01-cover-pagenum"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, S2 + BEAT);

      /* Scene 3 — gold italic lands on the downbeat; the footer band ticks in cell by cell on the half-beat. */
      tl.fromTo(byId("01-cover-line-2"), { opacity: 0, y: 58, rotation: 2.2, transformOrigin: "0% 50%" }, { opacity: 1, y: 0, rotation: 0, duration: 0.72, ease: "circ.out" }, S3);
      Array.prototype.slice.call(document.querySelectorAll('[id^="01-cover-cell-"]')).forEach(function (cell, i) {
        const at = S3 + BEAT * 0.5 * i; /* each cell lands on the half-beat, left to right */
        tl.fromTo(cell.querySelector("i"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, at);
        tl.fromTo(cell.querySelector("span"), { opacity: 0, y: 14, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.62, ease: "power3.out" }, at);
      });

      /* Finale hold — the type locks and holds; only the sun breathes (ambient push under the last beat, no exit). */
      tl.to(byId("01-cover-sun"), { scale: 1.02, duration: DUR - 4.2, ease: "sine.inOut" }, 4.2);

      window.__timelines["01-cover"] = tl;
    })();
  </script>
