      var slot = document.getElementById("02-masalah-slot");

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–2.09s) — in-place token cycle (discrete-text-sequence):

         holds; identical size across states; instant — no fade, no slide. */

        { t: 0.0, word: "Saintek", gold: false },
        { t: 0.52, word: "Soshum", gold: false },
        { t: 1.04, word: "Campuran", gold: true }

      var state = -1;
      tl.to(
        seq,
        {
          t: TOTAL,
          duration: TOTAL,
          ease: "none",
          onUpdate: function () {
            var i = 0;
            for (var k = TOKENS.length - 1; k >= 0; k--) {
              if (seq.t >= TOKENS[k].t) {
                i = k;
                break;
              }
            }
            if (i !== state) {
              state = i;
              word.textContent = TOKENS[i].word;
              qmark.style.color = TOKENS[i].gold ? GOLD : INK;
            }

        },

      /* Scene 2 (2.09–3.13s) — slam: scale from big, blur off, long-tail settle,
