  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";

      var FRAME = "06-tur";
      var DUR = 6.26;

      /* ---- geometry -------------------------------------------------------
         The window is 960x480 outer; the 1px hairline leaves a 958x478 content
         box — that box is the camera viewport and the world's local space. */
      var WW = 958,
        HW = 478;
      var CEN = { x: WW / 2, y: HW / 2 }; /* 479, 239 — the world's origin */
      var PLATE_W = 1905,
        PLATE_H = 5908; /* full-page.png native; 1 world unit = 1 plate px */
      var RAIL_LEN = 960; /* marker track length (rail x 60 .. 1020) */
      var S1 = WW / PLATE_W; /* 0.502887 — stop scale: plate fills the window width */
      var S2 = (HW * 0.94) / PLATE_H; /* 0.076053 — overview: whole plate in view */
      var HALF = HW / S1 / 2; /* 475.255 — half the visible plate rows at S1 */

      /* Counter-translate for the single-wrapper camera: T = -S * (target - centre).
         (viewport-change's single-wrapper form; measured plate geometry, baked.) */
      function pose(cy, s) {
        return { x: -s * (PLATE_W / 2 - CEN.x), y: -s * (cy - CEN.y) };
      }
      var P = {
        start: pose(HALF, S1), /* plate top — top bar + nav + hero, rows 0..950.5 */
        rumpun: pose(1080 + HALF, S1), /* rows 1080..2030.5 */
        metode: pose(3045 + HALF, S1), /* rows 3045..3995.5 */
        panduan: pose(4020 + HALF, S1), /* rows 4020..4970.5 */
        overview: pose(PLATE_H / 2, S2) /* whole plate, held to the cut */
      };

      var world = document.getElementById("06-tur-world");
      var marker = document.getElementById("06-tur-marker");
      var readout = document.getElementById("06-tur-readout-value");
      var cam = { scale: S1, x: P.start.x, y: P.start.y };
      var drift = { p: 0 };

      /* ONE writer: the camera composite (phase transform + drift), the rail
         marker and the readout — all three are the same "page position". */
      function applyCamera() {
        var dx = Math.sin(drift.p) * 3.5;
        var dy = Math.sin(drift.p * 1.31) * 2.2;
        var x = cam.x + dx,
          y = cam.y + dy;
        world.style.transform = "translate(" + x + "px," + y + "px) scale(" + cam.scale + ")";
        var pageY = Math.min(Math.max(CEN.y - y / cam.scale, 0), PLATE_H);
        marker.style.transform = "translateX(" + (pageY / PLATE_H) * RAIL_LEN + "px)";
        readout.textContent = String(Math.round(pageY / 10) * 10);
      }
      applyCamera(); /* seed frame 0 */

      function byId(id) {
        return document.getElementById(id);
      }
      var win = byId("06-tur-window");
      var eyebrow = byId("06-tur-eyebrow");
      var plateinfo = byId("06-tur-plateinfo");
      var pagenum = byId("06-tur-pagenum");
      var rail = byId("06-tur-rail");
      var readoutBox = byId("06-tur-readout");
      var disA = byId("06-tur-display-a");
      var disB = byId("06-tur-display-b");
      var shots = {
        rumpun: byId("06-tur-shot-rumpun"),
        metode: byId("06-tur-shot-metode"),
        panduan: byId("06-tur-shot-panduan")
      };
      var labels = {
        rumpun: byId("06-tur-label-rumpun"),
        metode: byId("06-tur-label-metode"),
        panduan: byId("06-tur-label-panduan")
      };
      var ticks = {
        rumpun: byId("06-tur-tick-rumpun"),
        metode: byId("06-tur-tick-metode"),
        panduan: byId("06-tur-tick-panduan")
      };

      var tl = gsap.timeline({ paused: true });

      /* full-span drift — keeps the holds alive; also the timeline span anchor */
      tl.to(drift, { p: Math.PI * 2 * 1.5, duration: DUR, ease: "none", onUpdate: applyCamera }, 0);

      /* Scene 1 (0.0–2.09) — the viewport opens at the top of the plate (the
         hero), the display lands, then the world camera glides DOWN with soft
         easing; no cursor anywhere */
      tl.fromTo(win, { clipPath: "inset(0% 0% 97% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, 0.08);
      tl.fromTo(eyebrow, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.12);
      tl.fromTo(plateinfo, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.18);
      tl.fromTo(pagenum, { opacity: 0 }, { opacity: 0.75, duration: 0.45, ease: "power2.out" }, 0.24);
      tl.fromTo(disA, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo(disB, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.34);
      tl.fromTo(rail, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 0.25);
      tl.fromTo(readoutBox, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.3);
      tl.fromTo(marker, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.72);
      tl.to(cam, { y: P.rumpun.y, duration: 1.64, ease: "power2.inOut", onUpdate: applyCamera }, 0.45);

      /* Scene 2 (2.09–4.18) — land at RUMPUN JURUSAN: the label settles onto the
         rail and its leader draws down; the sharp section shot swaps in while
         stopped, then the next leg of the multi-phase camera */
      tl.fromTo(labels.rumpun, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.1);
      tl.fromTo(ticks.rumpun, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 2.16);
      tl.fromTo(shots.rumpun, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, 2.14);
      tl.to(cam, { y: P.metode.y, duration: 1.38, ease: "power2.inOut", onUpdate: applyCamera }, 2.8);
      tl.to(shots.rumpun, { opacity: 0, duration: 0.2, ease: "power1.in" }, 2.84);

      /* Scene 3a (4.18–5.29) — brief stop at METODE ID3, then a short hop */
      tl.fromTo(labels.metode, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.19);
      tl.fromTo(ticks.metode, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 4.25);
      tl.fromTo(shots.metode, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, 4.23);
      tl.to(cam, { y: P.panduan.y, duration: 0.36, ease: "power3.out", onUpdate: applyCamera }, 4.93);
      tl.to(shots.metode, { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.95);

      /* Scene 3b (5.29–6.26) — stop at PANDUAN; then the camera pulls back to
         the whole plate (scale + counter-translate in ONE tween, shared ease —
         the plate reads as a 145x449 strip), and holds to the cut */
      tl.fromTo(labels.panduan, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.3);
      tl.fromTo(ticks.panduan, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 5.36);
      tl.fromTo(shots.panduan, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, 5.34);
      tl.to(cam, { scale: S2, x: P.overview.x, y: P.overview.y, duration: 0.34, ease: "power2.inOut", onUpdate: applyCamera }, 5.74);
      tl.to(shots.panduan, { opacity: 0, duration: 0.18, ease: "power1.in" }, 5.76);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME] = tl;
    })();
  </script>
