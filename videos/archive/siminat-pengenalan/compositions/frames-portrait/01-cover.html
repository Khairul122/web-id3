  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const el = function (id) { return document.getElementById(id); };

      /* Beat spine — the bed is 115 BPM; four beats make the 2.09s measure grid.
         Scene onsets are the packet windows (0 / 2.0 / 4.08, the frame's downbeats). */
      const BEAT = 60 / 115; /* 0.5217s — every accent below reads off this one grid */
      const S2 = 2.0;        /* Scene 2 — "Kenali" slam, "Minatmu." snap, pagenum */
      const S3 = 4.08;       /* Scene 3 — gold italic pair + footer rows */
      const DUR = 6.165;     /* frame duration, fixed upstream */

      /* Scene 1 — the ground settles open (sun core, haze halo, subordinate ember), then the mark blooms
         open with its glow and the eyebrow follows one beat later: one run, long tails, nothing else yet. */
      tl.fromTo(el("cover01-sun"), { opacity: 0.58, scale: 1.07 }, { opacity: 1, scale: 1, duration: 1.9, ease: "power2.out" }, 0);
      tl.fromTo(el("cover01-halo"), { opacity: 0.55, scale: 1.05 }, { opacity: 1, scale: 1, duration: 2.2, ease: "power2.out" }, 0);
      tl.fromTo(el("cover01-ember"), { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 2.4, ease: "sine.out" }, 0);
      tl.fromTo(el("cover01-glow"), { opacity: 0, scale: 0.45 }, { opacity: 0.5, scale: 1.3, duration: 1.3, ease: "power2.out" }, BEAT * 0.5);
      tl.fromTo(el("cover01-logo"), { opacity: 0, scale: 0.84, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.0, ease: "expo.out" }, BEAT * 0.5);
      tl.fromTo(el("cover01-eyebrow"), { opacity: 0, y: 10, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "power3.out" }, BEAT);

      /* Scene 2 — beat one of the type: "Kenali" dives in (scale+blur slam, lands on the pad edge);
         "Minatmu." side-snaps in on the next beat; the pagenum tags on that same beat. */
      tl.fromTo(el("cover01-line-1"), { opacity: 0, scale: 1.5, y: -70, filter: "blur(16px)", transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.62, ease: "power4.out" }, S2);
      tl.fromTo(el("cover01-line-2"), { opacity: 0, x: -190, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, S2 + BEAT);
      tl.fromTo(el("cover01-pagenum"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, S2 + BEAT);

      /* Scene 3 — the gold italic lands on the downbeat ("Temukan Arah") and its tail settles on the
         half-beat ("Kuliahmu."); the stacked footer band ticks in row by row on the half-beat, hairline first. */
      tl.fromTo(el("cover01-line-3"), { opacity: 0, y: 58, rotation: 2.2, transformOrigin: "0% 50%" }, { opacity: 1, y: 0, rotation: 0, duration: 0.72, ease: "circ.out" }, S3);
      tl.fromTo(el("cover01-line-4"), { opacity: 0, y: 74, scale: 1.06, filter: "blur(8px)", transformOrigin: "0% 50%" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.66, ease: "power3.out" }, S3 + BEAT * 0.5);
      Array.prototype.slice.call(el("cover01-footer").querySelectorAll(".cover01-row")).forEach(function (row, i) {

        tl.fromTo(row.querySelector("span"), { opacity: 0, y: 14, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.62, ease: "power3.out" }, at);
      });

      /* Finale hold — the display locks and holds; only the sun keeps breathing underneath (no exit). */
      tl.to(el("cover01-sun"), { scale: 1.02, duration: DUR - 4.2, ease: "sine.inOut" }, 4.2);

      window.__timelines["01-cover"] = tl;
    })();
